<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" aria-label="Folded linen stack">
  <defs>
    <pattern id="lins" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 3h10M0 7h10" stroke="#000" stroke-width="0.7" opacity="0.10"/>
      <path d="M3 0v10M7 0v10" stroke="#000" stroke-width="0.7" opacity="0.06"/>
    </pattern>
    <radialGradient id="shs" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f1ed"/>
      <stop offset="1" stop-color="#d7d5ce"/>
    </linearGradient>
  </defs>

  <ellipse cx="300" cy="640" rx="215" ry="34" fill="url(#shs)"/>

  <g stroke="#1a1a1a" stroke-width="2">
    <!-- three folded pieces -->
    <g transform="translate(0 0)">
      <rect x="150" y="470" width="300" height="120" rx="8" fill="url(#fold)"/>
      <rect x="150" y="470" width="300" height="120" rx="8" fill="url(#lins)"/>
      <line x1="150" y1="510" x2="450" y2="510" stroke="#000" stroke-width="1" opacity="0.12"/>
      <line x1="150" y1="550" x2="450" y2="550" stroke="#000" stroke-width="1" opacity="0.12"/>
    </g>
    <g transform="translate(0 0)">
      <rect x="165" y="360" width="270" height="115" rx="8" fill="url(#fold)"/>
      <rect x="165" y="360" width="270" height="115" rx="8" fill="url(#lins)"/>
      <line x1="165" y1="400" x2="435" y2="400" stroke="#000" stroke-width="1" opacity="0.12"/>
      <line x1="165" y1="438" x2="435" y2="438" stroke="#000" stroke-width="1" opacity="0.12"/>
    </g>
    <g transform="translate(0 0)">
      <rect x="180" y="258" width="240" height="108" rx="8" fill="url(#fold)"/>
      <rect x="180" y="258" width="240" height="108" rx="8" fill="url(#lins)"/>
      <line x1="180" y1="296" x2="420" y2="296" stroke="#000" stroke-width="1" opacity="0.12"/>
    </g>
  </g>

  <!-- belly band with logo on top piece -->
  <g>
    <rect x="255" y="248" width="90" height="128" fill="#0f0f0f"/>
    <text x="300" y="318" text-anchor="middle" fill="#fff" font-family="'Jost',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="4" font-weight="600" transform="rotate(90 300 312)">ANDRO</text>
  </g>
</svg>
