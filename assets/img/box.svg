<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" aria-label="ANDRO packaging">
  <defs>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <radialGradient id="sh" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="linb" width="9" height="9" patternUnits="userSpaceOnUse">
      <path d="M0 3h9M0 6h9" stroke="#fff" stroke-width="0.6" opacity="0.05"/>
    </pattern>
  </defs>

  <ellipse cx="300" cy="600" rx="230" ry="40" fill="url(#sh)"/>

  <!-- box side -->
  <path d="M120 360 L300 430 L480 360 L480 470 L300 540 L120 470 Z" fill="url(#side)"/>
  <path d="M120 360 L300 430 L480 360 L480 470 L300 540 L120 470 Z" fill="url(#linb)"/>
  <!-- lid top -->
  <path d="M120 360 L300 290 L480 360 L300 430 Z" fill="url(#lid)"/>
  <path d="M120 360 L300 290 L480 360 L300 430 Z" fill="url(#linb)"/>
  <!-- lid edge highlight -->
  <path d="M120 360 L300 290 L480 360" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>
  <path d="M300 430 L300 540" stroke="#000" stroke-width="1" opacity="0.5"/>

  <!-- logo on lid -->
  <g transform="translate(300 360)">
    <text x="0" y="4" text-anchor="middle" fill="#fff" font-family="'Jost',Helvetica,Arial,sans-serif" font-size="26" letter-spacing="9" font-weight="600" transform="skewX(-27) scale(1 0.72)">ANDRO</text>
    <text x="4" y="26" text-anchor="middle" fill="#8a8a8a" font-family="'Jost',Helvetica,Arial,sans-serif" font-size="8" letter-spacing="5" transform="skewX(-27) scale(1 0.72)">LINEN CO.</text>
  </g>

  <!-- ribbon -->
  <path d="M300 290 L300 430 L300 540" stroke="#fff" stroke-width="10" opacity="0.85"/>
  <path d="M120 360 L300 430" stroke="#fff" stroke-width="8" opacity="0.7"/>
  <path d="M480 360 L300 430" stroke="#fff" stroke-width="8" opacity="0.7"/>
</svg>
