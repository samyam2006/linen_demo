<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" aria-label="ANDRO linen boxer brief">
  <defs>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f1ee"/>
      <stop offset="0.5" stop-color="#e4e2dd"/>
      <stop offset="1" stop-color="#d3d1cb"/>
    </linearGradient>
    <pattern id="lin" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <path d="M0 3h10M0 7h10" stroke="#000" stroke-width="0.7" opacity="0.10"/>
      <path d="M3 0v10M7 0v10" stroke="#000" stroke-width="0.7" opacity="0.06"/>
    </pattern>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="300" cy="690" rx="200" ry="34" fill="url(#shadow)"/>

  <!-- garment body -->
  <g>
    <path d="M150 250
             C150 250 150 210 152 200
             L448 200
             C450 210 450 250 450 250
             L452 360
             C455 470 430 520 400 560
             C378 588 350 600 330 560
             C316 530 306 500 300 470
             C294 500 284 530 270 560
             C250 600 222 588 200 560
             C170 520 145 470 148 360 Z"
          fill="url(#cloth)" stroke="#1a1a1a" stroke-width="2.2"/>
    <path d="M150 250
             C150 250 150 210 152 200
             L448 200
             C450 210 450 250 450 250
             L452 360
             C455 470 430 520 400 560
             C378 588 350 600 330 560
             C316 530 306 500 300 470
             C294 500 284 530 270 560
             C250 600 222 588 200 560
             C170 520 145 470 148 360 Z"
          fill="url(#lin)"/>
    <!-- contour fabric folds -->
    <path d="M210 270 C240 330 250 420 250 500" fill="none" stroke="#000" stroke-width="1.4" opacity="0.10"/>
    <path d="M390 270 C360 330 350 420 350 500" fill="none" stroke="#000" stroke-width="1.4" opacity="0.10"/>
    <path d="M300 250 L300 460" stroke="#000" stroke-width="1.2" opacity="0.08"/>
    <path d="M170 300 C210 360 235 430 240 520" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- waistband -->
  <g>
    <rect x="146" y="176" width="308" height="48" rx="6" fill="#0f0f0f"/>
    <rect x="146" y="176" width="308" height="48" rx="6" fill="url(#lin)" opacity="0.4"/>
    <text x="300" y="206" text-anchor="middle" fill="#fff" font-family="'Jost',Helvetica,Arial,sans-serif" font-size="17" letter-spacing="7" font-weight="600">A N D R O</text>
    <line x1="146" y1="224" x2="454" y2="224" stroke="#000" stroke-width="1" opacity="0.5"/>
    <line x1="150" y1="176" x2="450" y2="176" stroke="#fff" stroke-width="1" opacity="0.15"/>
  </g>

  <!-- leg hems -->
  <path d="M200 560 C222 588 250 600 270 560" fill="none" stroke="#0f0f0f" stroke-width="7" stroke-linecap="round"/>
  <path d="M330 560 C350 600 378 588 400 560" fill="none" stroke="#0f0f0f" stroke-width="7" stroke-linecap="round"/>
</svg>
