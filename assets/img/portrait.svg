<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img" aria-label="ANDRO campaign portrait">
  <defs>
    <linearGradient id="studio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9e7e2"/>
      <stop offset="1" stop-color="#c9c7c0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c5c58"/>
      <stop offset="0.5" stop-color="#3a3a37"/>
      <stop offset="1" stop-color="#1c1c1a"/>
    </linearGradient>
    <linearGradient id="brief" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f3ef"/>
      <stop offset="1" stop-color="#dcdad3"/>
    </linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer><feComposite operator="over" in2="SourceGraphic"/></filter>
  </defs>

  <rect width="640" height="800" fill="url(#studio)"/>
  <!-- soft light pool -->
  <ellipse cx="320" cy="330" rx="260" ry="330" fill="#fff" opacity="0.35"/>

  <!-- figure: stylised male torso -->
  <g>
    <!-- neck + shoulders -->
    <path d="M300 150 q20 -8 40 0 l4 34 q40 12 66 46 q26 34 30 96 l6 150 q-70 26 -146 26 q-76 0 -146 -26 l6 -150 q4 -62 30 -96 q26 -34 66 -46 z"
          fill="url(#body)"/>
    <!-- head -->
    <ellipse cx="320" cy="112" rx="46" ry="54" fill="url(#body)"/>
    <!-- pec + ab definition -->
    <path d="M320 210 v240" stroke="#000" stroke-width="2" opacity="0.25"/>
    <path d="M250 250 q70 30 140 0" fill="none" stroke="#000" stroke-width="2" opacity="0.18"/>
    <path d="M270 320 h100 M272 360 h96 M276 398 h88" stroke="#000" stroke-width="2" opacity="0.15"/>
    <!-- highlight -->
    <path d="M250 200 q-14 120 0 250" fill="none" stroke="#fff" stroke-width="6" opacity="0.15"/>
  </g>

  <!-- brief -->
  <path d="M188 470 q132 40 264 0 l-2 40 q-6 60 -60 96 q-30 20 -70 -8 q-40 28 -70 8 q-54 -36 -60 -96 z"
        fill="url(#brief)" stroke="#111" stroke-width="1.5"/>
  <rect x="184" y="460" width="272" height="22" rx="4" fill="#0f0f0f"/>
  <text x="320" y="475" text-anchor="middle" fill="#fff" font-family="'Jost',Helvetica,Arial,sans-serif" font-size="10" letter-spacing="5" font-weight="600">ANDRO</text>

  <!-- legs suggestion -->
  <path d="M210 566 l-14 234 h70 l14 -190 z" fill="url(#body)"/>
  <path d="M430 566 l14 234 h-70 l-14 -190 z" fill="url(#body)"/>

  <rect width="640" height="800" filter="url(#grain)" opacity="0.5"/>
</svg>
